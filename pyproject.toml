[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2md"
version = "0.1.0"
description = "Discover papers and retrieve full text with Mistral Document AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "markdown-it-py>=3,<5", "PyMuPDF>=1.28,<2", "pymupdf4llm>=1.28,<2"]

[project.scripts]
paper2md = "paper2md.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
